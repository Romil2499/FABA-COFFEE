<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faba Coffee | Gallery</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#120d0b,#2b1d17);
    color:white;
}

header{
    width:100%;
    display:flex;
    justify-content:center;
    position:fixed;
    top:0;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(10px);
    z-index:100;
}

.navbar{
    list-style:none;
    display:flex;
    gap:20px;
    padding:15px;
}

.navbar a{
    text-decoration:none;
    color:#f5d6b4;
    font-weight:bold;
}

main{
    padding-top:100px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
    transition:0.3s;
}

.gallery img:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<header>
<nav>
<ul class="navbar">
<li><a href="/">Home</a></li>
<li><a href="/history.html">History</a></li>
<li><a href="/achievements.html">Achievements</a></li>
<li><a href="/gallery.html">Gallery</a></li>
</ul>
</nav>
</header>

<main>

<div class="gallery" id="gallery">

<img src="images/pop up.jpg">
<img src="images/san rafael.jpg">
<img src="images/burgos.jpg">

</div>

</main>

<script>

let gallery =
JSON.parse(localStorage.getItem("gallery")) || [];

function renderGallery(){

let html = `
<img src="images/pop up.jpg">
<img src="images/san rafael.jpg">
<img src="images/burgos.jpg">
`;

gallery.forEach(img=>{
html += `<img src="${img}">`;
});

document.getElementById("gallery").innerHTML = html;
}

renderGallery();

</script>

</body>
</html>
