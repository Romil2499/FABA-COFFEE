<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Faba Coffee</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

header{
    padding:15px;
    background:#000;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

button{
    padding:10px;
    background:gold;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.container{
    padding:20px;
    display:grid;
    gap:20px;
}

.box{
    background:#1e1411;
    padding:15px;
    border-radius:10px;
}

input, textarea{
    width:100%;
    padding:8px;
    margin:5px 0;
}

img{
    width:100px;
    margin:5px;
    border-radius:5px;
}
</style>
</head>

<body>

<header>
<h2>ADMIN DASHBOARD</h2>
<button onclick="logout()">Logout</button>
</header>

<div class="container">
    <div class="box">
        <h3>Recovery Code</h3>
    
        <button onclick="generateRecovery()">Generate Recovery Code</button>
    
        <p id="recoveryResult"></p>
    </div>
<!-- SETTINGS -->
<div class="box">
    <h3>Admin Settings</h3>

    <label>Change Password</label>
    <input id="newPass" placeholder="New Password">

    <label>Change Cheat Code</label>
    <input id="newCheat" placeholder="New Cheat Code">

    <button onclick="saveSettings()">Save Settings</button>
</div>

<!-- GALLERY -->
<div class="box">
<h3>Edit Gallery</h3>
<input id="galleryInput" placeholder="Image URL">
<button onclick="addGallery()">Add Image</button>
<div id="galleryPreview"></div>
</div>

<!-- ACHIEVEMENTS -->
<div class="box">
<h3>Edit Achievements</h3>
<input id="title" placeholder="Title">
<textarea id="desc" placeholder="Description"></textarea>
<input id="img" placeholder="Image URL">
<button onclick="addAchievement()">Add Achievement</button>
<div id="achievementsPreview"></div>
</div>

</div>

<script>

let gallery = [];
let achievements = JSON.parse(localStorage.getItem("achievements")) || [];

/* ======================
LOAD GALLERY FROM FLASK
====================== */
async function loadGallery(){

```
const response = await fetch("/get-gallery");
gallery = await response.json();

render();
```

}

/* ======================
ADD GALLERY IMAGE
====================== */
async function addGallery(){

```
let img =
document.getElementById("galleryInput").value;

if(img === ""){
    alert("Enter image URL");
    return;
}

gallery.push(img);

await fetch("/save-gallery",{
    method:"POST",
    headers:{
        "Content-Type":"application/json"
    },
    body:JSON.stringify({
        gallery:gallery
    })
});

document.getElementById("galleryInput").value = "";

render();
```

}

/* ======================
DELETE IMAGE
====================== */
async function deleteImage(index){

```
gallery.splice(index,1);

await fetch("/save-gallery",{
    method:"POST",
    headers:{
        "Content-Type":"application/json"
    },
    body:JSON.stringify({
        gallery:gallery
    })
});

render();
```

}

/* ======================
ACHIEVEMENTS
====================== */
function addAchievement(){

```
let item = {
    title: document.getElementById("title").value,
    desc: document.getElementById("desc").value,
    img: document.getElementById("img").value
};

achievements.push(item);

localStorage.setItem(
    "achievements",
    JSON.stringify(achievements)
);

render();
```

}

/* ======================
RENDER
====================== */
function render(){

document.getElementById("galleryPreview").innerHTML =
gallery.map((img,index)=>`

<div style="
display:inline-block;
position:relative;
margin:5px;
">

<img src="${img}"
style="
width:120px;
height:120px;
object-fit:cover;
border-radius:10px;
">

<button
onclick="deleteImage(${index})"
style="
position:absolute;
top:0;
right:0;
background:red;
color:white;
border:none;
cursor:pointer;
padding:5px;
">
X </button>

</div>
`).join("");

document.getElementById("achievementsPreview").innerHTML =
achievements.map(a => `

<div style="margin-top:10px;">
<b>${a.title}</b>
<p>${a.desc}</p>
<img src="${a.img}">
</div>
`).join("");
}

/* ======================
LOGOUT
====================== */
function logout(){
window.location.href = "/";
}

/* ======================
LOAD SETTINGS
====================== */
async function loadSettings(){

const response =
await fetch("/get-settings");

const settings =
await response.json();

document.getElementById("newPass").value =
settings.password;

document.getElementById("newCheat").value =
settings.cheat_code;
}

/* ======================
SAVE SETTINGS
====================== */
async function saveSettings(){

const password =
document.getElementById("newPass").value;

const cheat_code =
document.getElementById("newCheat").value;

const response =
await fetch("/save-settings",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
password,
cheat_code
})
});

const result =
await response.json();

if(result.success){
alert("✅ Settings Saved!");
}
}

/* ======================
RECOVERY CODE
====================== */
async function generateRecovery(){

const response =
await fetch("/generate-recovery",{
method:"POST"
});

const data =
await response.json();

if(data.success){

document.getElementById(
"recoveryResult"
).innerHTML =
"🔑 Recovery Code: " +
data.code;
}
}

/* ======================
START
====================== */
loadGallery();
loadSettings();
render();

</script>

</body>
</html>
